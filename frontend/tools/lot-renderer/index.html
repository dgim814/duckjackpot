<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lot renderer</title>
    <style>
      body { margin: 0; background: #111; color: #ccc; font: 12px sans-serif; }
      #out { width: 100%; display: block; }
      #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
      #grid figure { margin: 0; }
      #grid img { width: 100%; display: block; }
      #log { white-space: pre-wrap; padding: 6px; }
    </style>
  </head>
  <body>
    <canvas id="out"></canvas>
    <div id="grid"></div>
    <div id="log"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
